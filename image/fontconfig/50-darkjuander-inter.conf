<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Sort before 56-google-noto-sans-vf.conf so Inter is the default sans. -->
  <dir>/usr/share/fonts/darkjuander</dir>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>
</fontconfig>
