# The Containerfile runs dracut and replaces the initramfs shipped by the
# base image. bootc-image-builder does not rebuild it later. No DARKJUANDER
# image has been booted.
add_dracutmodules+=" plymouth "
install_items+=" /usr/share/fonts/darkjuander/Inter.ttf /usr/share/fonts/darkjuander/Inter-Regular.ttf /usr/share/fonts/darkjuander/OFL-Inter.txt /usr/share/fontconfig/conf.avail/50-darkjuander-inter.conf "
