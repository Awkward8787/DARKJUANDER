name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
      - name: demo scenes
        run: ./scripts/run-demos.sh
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck openssl
          shellcheck scripts/*.sh
          ./scripts/test-package-release-assets.sh
          ./scripts/test-iso-depsolve.sh
          ./scripts/test-smoke-marker.sh
          ./scripts/test-release-version.sh
          ./scripts/test-write-disk-config.sh
      - name: containerfile and kernel-config script
        run: |
          ./scripts/check-containerfile.sh
          ./scripts/check-kernel-config.sh tests/fixtures/kernel-good.config
          if ./scripts/check-kernel-config.sh tests/fixtures/kernel-bad.config; then
            echo "incomplete kernel config should fail"
            exit 1
          fi
