# Build installable DARKJUANDER images.
#
# A v* tag publishes a GitHub Release and pushes
# ghcr.io/awkward8787/darkjuander:<tag> plus :latest.
# workflow_dispatch and pull_request runs are dry runs: workflow artifacts
# only, no Release, no GHCR push. pull_request is how a change to this
# file is proven before it is on the default branch. GitHub does not offer
# workflow_dispatch for a workflow that exists only on a feature branch.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: A v* tag is what publishes. This input does not publish from a branch.
        type: boolean
        default: true
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build-release-disk.sh"
      - "scripts/iso-depsolve.sh"
      - "scripts/package-release-assets.sh"
      - "scripts/smoke-qemu.sh"
      - "scripts/render-release-notes.sh"
      - "image/Containerfile"
      - "image/console-password.txt"

permissions:
  contents: read
  id-token: write
  packages: write

# A new push waits. cancel-in-progress used to kill image (aarch64) in the
# middle of the QEMU smoke test.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  image:
    name: image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            qemu_pkg: qemu-system-arm
            firmware_pkg: qemu-efi-aarch64
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
            qemu_pkg: qemu-system-x86
            firmware_pkg: ovmf
    steps:
      - uses: actions/checkout@v4

      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2

      - name: version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          else
            echo "version=0.0.0-dry.${GITHUB_SHA:0:12}" >> "${GITHUB_OUTPUT}"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman zstd "${{ matrix.qemu_pkg }}" "${{ matrix.firmware_pkg }}"

      - name: binaries
        run: |
          cargo build --workspace --release --locked
          mkdir -p out/stage dist/payload
          install -m 0755 target/release/umbrad out/stage/umbrad
          install -m 0755 target/release/dj out/stage/dj
          install -m 0755 target/release/dj-auditd out/stage/dj-auditd
          tar -C out/stage -czf "dist/payload/darkjuander-binaries-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.tar.gz" \
            umbrad dj dj-auditd

      - name: bootc image
        run: |
          sudo podman build \
            --platform "${{ matrix.platform }}" \
            --build-arg "DJ_VERSION=${{ steps.ver.outputs.version }}" \
            -f image/Containerfile \
            -t "localhost/dj-base:${{ steps.ver.outputs.version }}" \
            .

      - name: qcow2
        id: qcow2
        run: |
          ./scripts/build-release-disk.sh \
            "localhost/dj-base:${{ steps.ver.outputs.version }}" \
            out/disk qcow2
          mkdir -p dist/payload
          ver="${{ steps.ver.outputs.version }}"
          arch="${{ matrix.arch }}"
          mapfile -t qcows < <(find out/disk/qcow2 -type f -name '*.qcow2')
          test "${#qcows[@]}" -ge 1
          zstd -T0 -15 -f "${qcows[0]}" -o "dist/payload/darkjuander-${ver}-${arch}.qcow2.zst"
          cp -f "${qcows[0]}" dist/smoke.qcow2
          mapfile -t files < <(find dist/payload -type f | sort)
          ./scripts/package-release-assets.sh dist/release "${files[@]}"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        continue-on-error: true
        with:
          cosign-release: v2.5.3

      - name: sign SHA256SUMS
        id: sign
        if: steps.qcow2.outcome == 'success'
        continue-on-error: true
        run: |
          if ! command -v cosign >/dev/null; then
            echo "cosign is not installed; SHA256SUMS is unsigned" | tee dist/release/COSIGN.txt
            exit 1
          fi
          cosign sign-blob --yes \
            --bundle dist/release/SHA256SUMS.cosign.bundle \
            dist/release/SHA256SUMS
          echo "cosign keyless signed SHA256SUMS" | tee dist/release/COSIGN.txt

      - name: upload qcow2
        if: steps.qcow2.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: darkjuander-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/release/**

      - name: qemu smoke
        id: smoke
        if: steps.qcow2.outcome == 'success'
        env:
          SMOKE_TIMEOUT_SECS: "2400"
        run: ./scripts/smoke-qemu.sh dist/smoke.qcow2

      - name: upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkjuander-smoke-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            dist/smoke.qcow2.serial.log
            dist/smoke.qcow2.smoke.txt

      - name: push arch image
        if: steps.ver.outputs.publish == 'true' && steps.smoke.outcome == 'success'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          remote="ghcr.io/awkward8787/darkjuander:${{ steps.ver.outputs.version }}-${{ matrix.arch }}"
          sudo podman tag "localhost/dj-base:${{ steps.ver.outputs.version }}" "${remote}"
          sudo podman push "${remote}"

      - name: job summary
        if: always()
        run: |
          {
            echo "### image ${{ matrix.arch }}"
            echo
            echo '```'
            find dist -type f -printf '%s\t%p\n' 2>/dev/null | sort -k2 || true
            echo '```'
            echo
            if [[ -f dist/smoke.qcow2.smoke.txt ]]; then
              echo '```'
              cat dist/smoke.qcow2.smoke.txt
              echo '```'
            else
              echo "No smoke result file."
            fi
            if [[ -f dist/release/COSIGN.txt ]]; then
              echo
              echo '```'
              cat dist/release/COSIGN.txt
              echo '```'
            fi
            echo
            echo "qcow2 step: ${{ steps.qcow2.outcome }}"
            echo "smoke step: ${{ steps.smoke.outcome }}"
            echo
            echo "Primary release artifact is the qcow2. Fedora dnf repos stay disabled in the qcow2 and GHCR image. Anaconda ISO is a separate job (iso)."
          } >> "${GITHUB_STEP_SUMMARY}"

  # Anaconda ISO is a separate check from the qcow2 image job. It rebuilds
  # the bootc image and runs bootc-image-builder with a throwaway depsolve
  # layer. Failure here is visible as job "iso (arch)" and does not fail
  # "image (arch)" or block the publish job, which only needs image.
  iso:
    name: iso (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@v2

      - name: version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"
          else
            echo "version=0.0.0-dry.${GITHUB_SHA:0:12}" >> "${GITHUB_OUTPUT}"
          fi

      - name: install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman zstd

      - name: binaries
        run: |
          cargo build --workspace --release --locked
          mkdir -p out/stage
          install -m 0755 target/release/umbrad out/stage/umbrad
          install -m 0755 target/release/dj out/stage/dj
          install -m 0755 target/release/dj-auditd out/stage/dj-auditd

      - name: bootc image
        run: |
          sudo podman build \
            --platform "${{ matrix.platform }}" \
            --build-arg "DJ_VERSION=${{ steps.ver.outputs.version }}" \
            -f image/Containerfile \
            -t "localhost/dj-base:${{ steps.ver.outputs.version }}" \
            .

      - name: anaconda iso
        id: iso
        run: |
          ./scripts/build-release-disk.sh \
            "localhost/dj-base:${{ steps.ver.outputs.version }}" \
            out/disk anaconda-iso
          mkdir -p dist/iso-payload
          ver="${{ steps.ver.outputs.version }}"
          arch="${{ matrix.arch }}"
          mapfile -t isos < <(find out/disk/anaconda-iso -type f -name '*.iso')
          test "${#isos[@]}" -ge 1
          zstd -T0 -15 -f "${isos[0]}" -o "dist/iso-payload/darkjuander-${ver}-${arch}.iso.zst"
          mapfile -t files < <(find dist/iso-payload -type f | sort)
          ./scripts/package-release-assets.sh dist/iso-release "${files[@]}"

      - name: upload iso
        if: steps.iso.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: darkjuander-iso-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/iso-release/**

      - name: job summary
        if: always()
        run: |
          {
            echo "### iso ${{ matrix.arch }}"
            echo
            echo '```'
            find dist -type f -printf '%s\t%p\n' 2>/dev/null | sort -k2 || true
            echo '```'
            echo
            echo "iso step: ${{ steps.iso.outcome }}"
            echo
            echo "This job is the Anaconda installer ISO only. It does not gate the qcow2 image job or the publish release job. The ISO is built from a throwaway image with Fedora dnf repos enabled for installer depsolve; a system installed from the ISO has those repos enabled. bootc remains the update path."
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: publish release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y podman

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: darkjuander-*
          path: dist/parts

      - name: assemble
        run: |
          mkdir -p dist/staged dist/smoke
          find dist/parts -type f \( \
            -name '*.tar.gz' -o -name '*.zst' -o -name '*.part[0-9][0-9]' \
            \) -exec cp -n {} dist/staged/ \;
          mapfile -t files < <(find dist/staged -type f | sort)
          test "${#files[@]}" -ge 1
          ./scripts/package-release-assets.sh dist/out "${files[@]}"
          find dist/parts -name '*.smoke.txt' -exec cp -f {} dist/smoke/ \;
          smoke=$(mktemp)
          shopt -s nullglob
          notes=(dist/smoke/*.smoke.txt)
          if [[ ${#notes[@]} -eq 0 ]]; then
            echo "no per-arch smoke file was downloaded" > "${smoke}"
          else
            cat "${notes[@]}" > "${smoke}"
          fi
          ./scripts/render-release-notes.sh "${GITHUB_REF#refs/tags/}" "${smoke}" > dist/out/RELEASE_NOTES.md

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v2.5.3

      - name: sign combined checksums
        run: |
          cosign sign-blob --yes \
            --bundle dist/out/SHA256SUMS.cosign.bundle \
            dist/out/SHA256SUMS

      - name: push multi-arch index
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          ver="${GITHUB_REF#refs/tags/}"
          sudo podman manifest create "localhost/darkjuander:${ver}"
          sudo podman manifest add "localhost/darkjuander:${ver}" \
            "docker://ghcr.io/awkward8787/darkjuander:${ver}-aarch64"
          sudo podman manifest add "localhost/darkjuander:${ver}" \
            "docker://ghcr.io/awkward8787/darkjuander:${ver}-x86_64"
          sudo podman manifest push --all "localhost/darkjuander:${ver}" \
            "docker://ghcr.io/awkward8787/darkjuander:${ver}"
          sudo podman manifest create "localhost/darkjuander-latest"
          sudo podman manifest add "localhost/darkjuander-latest" \
            "docker://ghcr.io/awkward8787/darkjuander:${ver}-aarch64"
          sudo podman manifest add "localhost/darkjuander-latest" \
            "docker://ghcr.io/awkward8787/darkjuander:${ver}-x86_64"
          sudo podman manifest push --all "localhost/darkjuander-latest" \
            "docker://ghcr.io/awkward8787/darkjuander:latest"
          cosign sign --yes "ghcr.io/awkward8787/darkjuander:${ver}"
          cosign sign --yes "ghcr.io/awkward8787/darkjuander:latest"

      - name: github release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/out/RELEASE_NOTES.md
          files: dist/out/*

      - name: package visibility
        run: |
          {
            echo "GHCR packages are often private on first push."
            echo "bootc switch needs a public package. Confirm visibility at https://ghcr.io/awkward8787/darkjuander"
          } >> "${GITHUB_STEP_SUMMARY}"
