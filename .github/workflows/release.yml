# Build installable DARKJUANDER images.
#
# A v* tag push publishes a GitHub Release and pushes
# ghcr.io/awkward8787/darkjuander:<tag> plus :latest.
# workflow_dispatch defaults to a dry run. Set the dry_run input to false
# on a v* tag ref to publish from a manual run. pull_request runs are
# always dry runs: workflow artifacts only. pull_request is how a change
# to this file is proven before it is on the default branch.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Publish only when this is false and the ref is a v* tag. Default is a dry run.
        type: boolean
        default: true
      cosign_probe:
        description: From main only, sign ghcr.io/awkward8787/darkjuander-ci-probe. Never the release image. Default off.
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/build-release-disk.sh"
      - "scripts/iso-depsolve.sh"
      - "scripts/package-release-assets.sh"
      - "scripts/release-version.sh"
      - "scripts/smoke-qemu.sh"
      - "scripts/smoke_marker.py"
      - "scripts/write-disk-config.py"
      - "scripts/render-release-notes.sh"
      - "scripts/cosign-ghcr-auth-check.sh"
      - "scripts/assert-cosign-docker-config.sh"
      - "scripts/cosign-ci-probe.sh"
      - "scripts/mirror-fedora-bootc.sh"
      - "image/Containerfile"
      - "image/fedora-bootc.digest"
      - "image/console-password.txt"
      - "image/systemd/dj-expire-password.service"

permissions:
  contents: read

# A push replaces a run still in progress. The smoke step has its own hard
# cap, so this does not leave an aarch64 TCG guest running for hours.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # Pull requests, branch refs, and v* tags only read the public digest.
  # packages:write is not granted here, and the script is not run as root.
  mirror-check:
    name: mirror check
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: require the pinned digest
        run: ./scripts/mirror-fedora-bootc.sh --check

  # A manual run from main may copy the pin. Tag publishes do not.
  mirror-publish:
    name: mirror publish
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: mirror-fedora-bootc
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: login
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s\n' "${GH_TOKEN}" | sudo skopeo login ghcr.io --username "${GH_ACTOR}" --password-stdin

      - name: copy the pinned digest
        run: sudo ./scripts/mirror-fedora-bootc.sh --write

      - name: logout ghcr
        if: always()
        run: sudo skopeo logout ghcr.io || true

  image:
    name: image (${{ matrix.arch }})
    needs: [mirror-check, mirror-publish]
    if: >-
      always() &&
      needs.mirror-check.result != 'failure' &&
      needs.mirror-check.result != 'cancelled' &&
      needs.mirror-publish.result != 'failure' &&
      needs.mirror-publish.result != 'cancelled' &&
      (needs.mirror-check.result == 'success' || needs.mirror-publish.result == 'success')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            qemu_pkg: qemu-system-arm
            firmware_pkg: qemu-efi-aarch64
            # No KVM on this runner. Hard cap, under an hour.
            smoke_timeout: "2400"
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
            qemu_pkg: qemu-system-x86
            firmware_pkg: ovmf
            smoke_timeout: "600"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: true

      - name: version
        id: ver
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: ./scripts/release-version.sh

      - name: install image tools
        env:
          QEMU_PKG: ${{ matrix.qemu_pkg }}
          FIRMWARE_PKG: ${{ matrix.firmware_pkg }}
        run: |
          sudo apt-get update
          sudo apt-get install -y podman zstd "${QEMU_PKG}" "${FIRMWARE_PKG}"

      - name: binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          cargo build --workspace --release --locked
          mkdir -p out/stage dist/payload
          install -m 0755 target/release/umbrad out/stage/umbrad
          install -m 0755 target/release/dj out/stage/dj
          install -m 0755 target/release/dj-auditd out/stage/dj-auditd
          tar -C out/stage -czf "dist/payload/darkjuander-binaries-${VERSION}-${ARCH}.tar.gz" \
            umbrad dj dj-auditd

      - name: bootc image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          sudo podman build \
            --platform "${PLATFORM}" \
            --build-arg "DJ_VERSION=${VERSION}" \
            -f image/Containerfile \
            -t "localhost/dj-base:${VERSION}" \
            .

      - name: qcow2
        id: qcow2
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          ./scripts/build-release-disk.sh \
            "localhost/dj-base:${VERSION}" \
            out/disk qcow2
          mkdir -p dist/payload
          mapfile -t qcows < <(find out/disk/qcow2 -type f -name '*.qcow2')
          test "${#qcows[@]}" -ge 1
          zstd -T0 -15 -f "${qcows[0]}" -o "dist/payload/darkjuander-${VERSION}-${ARCH}.qcow2.zst"
          cp -f "${qcows[0]}" dist/smoke.qcow2
          mapfile -t files < <(find dist/payload -type f | sort)
          ./scripts/package-release-assets.sh dist/release "${files[@]}"

      - name: upload qcow2
        if: steps.qcow2.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darkjuander-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/release/**

      - name: qemu smoke
        id: smoke
        if: steps.qcow2.outcome == 'success'
        env:
          SMOKE_TIMEOUT_SECS: ${{ matrix.smoke_timeout }}
        run: ./scripts/smoke-qemu.sh dist/smoke.qcow2

      - name: upload smoke log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darkjuander-smoke-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            dist/smoke.qcow2.serial.log
            dist/smoke.qcow2.smoke.txt

      - name: export smoke-tested image
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          rm -f dist/smoke.qcow2
          rm -rf out/disk dist/payload
          mkdir -p dist/container
          sudo podman save -o dist/container/dj-base.tar "localhost/dj-base:${VERSION}"
          sudo chown "$(id -u):$(id -g)" dist/container/dj-base.tar
          sudo podman image inspect --format '{{.Id}}' "localhost/dj-base:${VERSION}" \
            | tee dist/container/image-id.txt
          printf '%s\n' "${VERSION}" > dist/container/version.txt

      - name: upload container
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darkjuander-container-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/container/**

      - name: job summary
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
          QCOW_OUTCOME: ${{ steps.qcow2.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "### image ${ARCH}"
            echo
            echo '```'
            find dist -type f -printf '%s\t%p\n' 2>/dev/null | sort -k2 || true
            echo '```'
            echo
            if [[ -f dist/smoke.qcow2.smoke.txt ]]; then
              echo '```'
              cat dist/smoke.qcow2.smoke.txt
              echo '```'
            else
              echo "No smoke result file."
            fi
            echo
            echo "qcow2 step: ${QCOW_OUTCOME}"
            echo "smoke step: ${SMOKE_OUTCOME}"
            echo
            echo "Primary release artifact is the qcow2. Fedora dnf repos stay disabled in the qcow2 and GHCR image. The iso job loads this container archive."
          } >> "${GITHUB_STEP_SUMMARY}"

  # Loads the container the image job smoke-tested. Does not rebuild it.
  iso:
    name: iso (${{ matrix.arch }})
    needs: image
    # mirror-publish is skipped on a pull request. Without this, GitHub also
    # skips jobs further down the chain even after image succeeded.
    if: always() && needs.image.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman zstd openssl

      - name: download smoke-tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: darkjuander-container-${{ matrix.arch }}
          path: dist/container

      - name: anaconda iso
        id: iso
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ver=$(tr -d '\r\n' < dist/container/version.txt)
          want=$(tr -d '\r\n' < dist/container/image-id.txt)
          tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          dry_re='^0\.0\.0-dry\.[0-9a-f]{12}$'
          if [[ ! "${ver}" =~ ${tag_re} && ! "${ver}" =~ ${dry_re} ]]; then
            echo "refusing container version" >&2
            exit 1
          fi
          sudo podman load -i dist/container/dj-base.tar
          got=$(sudo podman image inspect --format '{{.Id}}' "localhost/dj-base:${ver}")
          if [[ "${got}" != "${want}" ]]; then
            echo "loaded image id ${got} does not match smoke-tested ${want}" >&2
            exit 1
          fi
          ./scripts/build-release-disk.sh \
            "localhost/dj-base:${ver}" \
            out/disk anaconda-iso
          mkdir -p dist/iso-payload
          mapfile -t isos < <(find out/disk/anaconda-iso -type f -name '*.iso')
          test "${#isos[@]}" -ge 1
          zstd -T0 -15 -f "${isos[0]}" -o "dist/iso-payload/darkjuander-${ver}-${ARCH}.iso.zst"
          mapfile -t files < <(find dist/iso-payload -type f | sort)
          ./scripts/package-release-assets.sh dist/iso-release "${files[@]}"

      - name: upload iso
        if: steps.iso.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darkjuander-iso-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/iso-release/**

      - name: job summary
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
          ISO_OUTCOME: ${{ steps.iso.outcome }}
        run: |
          {
            echo "### iso ${ARCH}"
            echo
            echo '```'
            find dist -type f -printf '%s\t%p\n' 2>/dev/null | sort -k2 || true
            echo '```'
            echo
            echo "iso step: ${ISO_OUTCOME}"
            echo
            echo "This ISO is built from the smoke-tested container archive. It is not booted in CI. A kickstart post script disables Fedora dnf repos on the installed system."
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    name: publish release
    needs: [image, iso]
    # iso is allowed to fail without blocking the qcow2 release. Waiting for
    # it still lets a successful ISO artifact be attached. A bad tag name is
    # rejected by scripts/release-version.sh before it reaches a shell step.
    if: >-
      always() &&
      needs.image.result == 'success' &&
      (needs.iso.result == 'success' || needs.iso.result == 'failure' || needs.iso.result == 'skipped') &&
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-ghcr-latest
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: version
        id: ver
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: ./scripts/release-version.sh

      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y podman skopeo

      - name: download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: darkjuander-*
          path: dist/parts

      - name: assemble
        run: |
          mkdir -p dist/staged dist/smoke
          find dist/parts -type f \( \
            -name '*.tar.gz' -o -name '*.zst' -o -name '*.part[0-9][0-9]' \
            \) -exec cp -n {} dist/staged/ \;
          mapfile -t files < <(find dist/staged -type f | sort)
          test "${#files[@]}" -ge 1
          ./scripts/package-release-assets.sh dist/out "${files[@]}"
          find dist/parts -name '*.smoke.txt' -exec cp -f {} dist/smoke/ \;
          smoke=$(mktemp)
          shopt -s nullglob
          notes=(dist/smoke/*.smoke.txt)
          if [[ ${#notes[@]} -eq 0 ]]; then
            echo "no per-arch smoke file was downloaded" > "${smoke}"
          else
            cat "${notes[@]}" > "${smoke}"
          fi
          ./scripts/render-release-notes.sh "${GITHUB_REF#refs/tags/}" "${smoke}" > dist/out/RELEASE_NOTES.md

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.3

      - name: sign combined checksums
        run: |
          cosign sign-blob --yes \
            --bundle dist/out/SHA256SUMS.cosign.bundle \
            dist/out/SHA256SUMS

      - name: push multi-arch index
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "${GH_TOKEN}" | sudo podman login ghcr.io -u "${GH_ACTOR}" --password-stdin
          stage="ci-${GITHUB_RUN_ID}"
          mkdir -p dist
          mapfile -t tars < <(find dist/parts -name dj-base.tar | sort)
          test "${#tars[@]}" -eq 2
          for tar in "${tars[@]}"; do
            dir=$(dirname "${tar}")
            ver=$(tr -d '\r\n' < "${dir}/version.txt")
            want=$(tr -d '\r\n' < "${dir}/image-id.txt")
            test "${ver}" = "${VERSION}"
            base=$(basename "${dir}")
            arch=${base#darkjuander-container-}
            sudo podman rmi "localhost/dj-base:${ver}" >/dev/null 2>&1 || true
            sudo podman load -i "${tar}"
            got=$(sudo podman image inspect --format '{{.Id}}' "localhost/dj-base:${ver}")
            test "${got}" = "${want}"
            remote="ghcr.io/awkward8787/darkjuander:${stage}-${arch}"
            sudo podman tag "localhost/dj-base:${ver}" "${remote}"
            sudo podman push --digestfile "dist/${arch}.digest" "${remote}"
            grep -Eq '^sha256:[0-9a-f]{64}$' "dist/${arch}.digest"
          done
          sudo podman manifest create "localhost/darkjuander:${stage}"
          sudo podman manifest add "localhost/darkjuander:${stage}" \
            "docker://ghcr.io/awkward8787/darkjuander:${stage}-aarch64"
          sudo podman manifest add "localhost/darkjuander:${stage}" \
            "docker://ghcr.io/awkward8787/darkjuander:${stage}-x86_64"
          sudo podman manifest push --all --digestfile dist/index.digest \
            "localhost/darkjuander:${stage}" \
            "docker://ghcr.io/awkward8787/darkjuander:${stage}"
          grep -Eq '^sha256:[0-9a-f]{64}$' dist/index.digest
          index=$(tr -d '\r\n' < dist/index.digest)
          sudo skopeo inspect --raw \
            "docker://ghcr.io/awkward8787/darkjuander@${index}" > dist/index.raw
          python3 ./scripts/assert-index-children.py dist/index.raw \
            dist/aarch64.digest dist/x86_64.digest

      # sudo podman login stores credentials in root's containers auth file.
      # cosign runs as the runner user and reads the docker config instead.
      # Log in with cosign, require that ghcr.io entry, then sign the index digest.
      - name: sign image by digest
        id: sign
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "${GH_TOKEN}" | cosign login ghcr.io --username "${GH_ACTOR}" --password-stdin
          ./scripts/assert-cosign-docker-config.sh
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for file in dist/aarch64.digest dist/x86_64.digest dist/index.digest; do
            digest=$(tr -d '\r\n' < "${file}")
            cosign sign --yes "ghcr.io/awkward8787/darkjuander@${digest}"
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "${identity}" \
              "ghcr.io/awkward8787/darkjuander@${digest}"
          done
          digest=$(tr -d '\r\n' < dist/index.digest)
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: tag the signed digests
        id: tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          index=$(tr -d '\r\n' < dist/index.digest)
          seen=$(sudo skopeo inspect --format '{{.Digest}}' \
            "docker://ghcr.io/awkward8787/darkjuander@${index}")
          if [[ "${seen}" != "${index}" ]]; then
            echo "signed index ${index} is not what GHCR has (${seen})" >&2
            exit 1
          fi
          for arch in aarch64 x86_64; do
            digest=$(tr -d '\r\n' < "dist/${arch}.digest")
            sudo skopeo copy --preserve-digests \
              "docker://ghcr.io/awkward8787/darkjuander@${digest}" \
              "docker://ghcr.io/awkward8787/darkjuander:${VERSION}-${arch}"
          done
          sudo skopeo copy --all --preserve-digests \
            "docker://ghcr.io/awkward8787/darkjuander@${index}" \
            "docker://ghcr.io/awkward8787/darkjuander:${VERSION}"
          tagged=$(sudo skopeo inspect --format '{{.Digest}}' \
            "docker://ghcr.io/awkward8787/darkjuander:${VERSION}")
          if [[ "${tagged}" != "${index}" ]]; then
            echo "version tag digest ${tagged} is not the signed digest ${index}" >&2
            exit 1
          fi
          # An older tag must not point :latest backwards. Rank against every
          # v* tag on the remote, not against the order the jobs started.
          set +e
          remote_tags=$(git ls-remote --tags origin 'refs/tags/v*')
          fetched=$?
          set -e
          if [[ "${fetched}" -ne 0 ]]; then
            echo "could not list release tags" >&2
            exit 1
          fi
          set +e
          printf '%s\n' "${remote_tags}" | python3 ./scripts/highest-release-tag.py "${VERSION}"
          rank=$?
          set -e
          if [[ "${rank}" -eq 1 ]]; then
            echo "leaving :latest unchanged; ${VERSION} is not the highest v* tag"
          elif [[ "${rank}" -ne 0 ]]; then
            echo "could not rank ${VERSION} among release tags" >&2
            exit 1
          else
            sudo skopeo copy --all --preserve-digests \
              "docker://ghcr.io/awkward8787/darkjuander@${index}" \
              "docker://ghcr.io/awkward8787/darkjuander:latest"
            latest=$(sudo skopeo inspect --format '{{.Digest}}' \
              "docker://ghcr.io/awkward8787/darkjuander:latest")
            if [[ "${latest}" != "${index}" ]]; then
              echo "latest digest ${latest} is not the signed digest ${index}" >&2
              exit 1
            fi
          fi

      - name: logout registries
        if: always()
        run: |
          # cosign v2.5.3 has no logout command. The docker config is the file it wrote.
          rm -f "${HOME}/.docker/config.json"
          sudo podman logout ghcr.io || true

      - name: github release
        id: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: dist/out/RELEASE_NOTES.md
          files: dist/out/*

      - name: package visibility
        env:
          DIGEST: ${{ steps.sign.outputs.digest }}
        run: |
          {
            echo "Signed ghcr.io/awkward8787/darkjuander@${DIGEST}."
            echo "GHCR packages are often private on first push."
            echo "bootc switch needs a public package. Confirm visibility at https://ghcr.io/awkward8787/darkjuander"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: publish did not finish
        if: always() && (steps.sign.outcome != 'success' || steps.tag.outcome != 'success' || steps.release.outcome != 'success')
        run: |
          echo "Publish did not finish. Version tags and :latest are applied only after the index and per-arch digests verify. This job is a failure." >&2
          exit 1

      - name: logout registries again
        if: always()
        run: |
          rm -f "${HOME}/.docker/config.json"
          sudo podman logout ghcr.io || true

  # Pull requests cannot publish. cosign login must leave a ghcr.io entry in
  # the runner docker config. A following read of a missing digest is not a
  # write-auth test: this package is public, so an anonymous client can get
  # the same manifest answer. A fork pull request runs this copy of the
  # script with a read-only token. That token cannot publish this repository.
  cosign-auth:
    name: cosign auth
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.3

      - name: cosign login without publishing
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/cosign-ghcr-auth-check.sh

      - name: logout registries
        if: always()
        run: |
          # cosign v2.5.3 has no logout command. Removing this file drops its GHCR credential.
          rm -f "${HOME}/.docker/config.json"

  # Opt-in from main only. Signs darkjuander-ci-probe, never the release
  # image. Its Fulcio identity is refs/heads/main, which does not match
  # the SHA256SUMS identity (.../release.yml@refs/tags/v) in INSTALL.md.
  # Releases are on hold: do not dispatch this until that hold is lifted.
  cosign-probe:
    name: cosign probe
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.cosign_probe
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y podman

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.3

      - name: sign a scratch probe by digest
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_REF: ghcr.io/awkward8787/darkjuander-ci-probe:${{ github.run_id }}
        run: ./scripts/cosign-ci-probe.sh

      - name: logout registries
        if: always()
        run: |
          rm -f "${HOME}/.docker/config.json"
          sudo podman logout ghcr.io || true
